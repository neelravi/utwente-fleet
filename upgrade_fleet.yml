---
- name: Weekly Fleet Security Maintenance
  # Target all machines defined in the inventory
  hosts: all

  # Run commands with root privileges (sudo)
  become: yes

  # Skip machines that are offline instead of failing the whole run
  ignore_unreachable: yes

  # Ensure Ansible gathers system information (like OS family) before running tasks
  gather_facts: yes

  tasks:
    - name: Update apt cache and run a standard upgrade (Ubuntu/Debian only)
      ansible.builtin.apt:
        update_cache: yes
        upgrade: safe        # normal 'apt upgrade' (won't remove packages) - not a dist-upgrade
        autoremove: yes      # still clean up orphaned/unused dependencies
        autoclean: yes
      # Null-safe: skips non-Debian systems (e.g. the MacMini) and any offline
      # host whose facts were never gathered, instead of erroring on a missing key.
      when: ansible_facts.os_family | default('') == "Debian"

    - name: Check if a system reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required_file
      when: ansible_facts.os_family | default('') == "Debian"

    # NOTE: Automatic reboot has been intentionally REMOVED. Even when a kernel
    # or core update requires a reboot, this playbook will NOT reboot the host.
    # It only reports which machines need one, so their owners can reboot them
    # manually at a convenient time.
    - name: Report machines that need a manual reboot
      ansible.builtin.debug:
        msg: >-
          A kernel/core update was installed and this host REQUIRES A REBOOT.
          The reboot was NOT performed automatically - please reboot it manually.
      when:
        - ansible_facts.os_family | default('') == "Debian"
        - reboot_required_file.stat.exists | default(false)
