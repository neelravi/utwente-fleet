---
- name: Weekly Fleet Security Maintenance
  # Target all machines defined in the inventory
  hosts: all
  
  # Run commands with root privileges (sudo)
  become: yes 
  
  # Ensure Ansible gathers system information (like OS family) before running tasks
  gather_facts: yes
  
  tasks:
    - name: Update apt cache and run dist-upgrade (Ubuntu/Debian only)
      ansible.builtin.apt:
        update_cache: yes
        upgrade: dist
        autoremove: yes
        autoclean: yes
      # This condition ensures the MacMini (or any non-Debian system) is safely skipped
      when: ansible_facts['os_family'] == "Debian"

    - name: Check if a system reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required_file
      when: ansible_facts['os_family'] == "Debian"

    - name: Reboot the server safely if a kernel update was installed
      ansible.builtin.reboot:
        msg: "Reboot initiated by Ansible due to a kernel or core system update"
        connect_timeout: 5
        reboot_timeout: 600
        pre_reboot_delay: 0
        post_reboot_delay: 30
        test_command: uptime
      when: 
        - ansible_facts['os_family'] == "Debian"
        - reboot_required_file.stat.exists == true
