---
- name: Generate Fleet Hardware Dashboard
  hosts: all
  become: yes
  ignore_unreachable: yes   # Offline hosts are skipped, not treated as failures
  gather_facts: no  # Turn off automatic background gathering

  tasks:

    # ── Semaphore working directory ───────────────────────────────────────────
    # NOTE: We deliberately do NOT wipe the whole directory anymore. A blanket
    # wipe would also delete the last good report of any host that is currently
    # offline. Instead we keep the directory, let reachable hosts overwrite
    # their own fact file below, and only prune fact files belonging to hosts
    # that are no longer in the inventory (the original "ghost entry" problem).
    - name: Ensure the facts directory exists (preserve existing reports)
      run_once: true
      delegate_to: localhost
      ansible.builtin.file:
        path: /tmp/fleet_facts
        state: directory
      become: no

    - name: Find existing fact files
      run_once: true
      delegate_to: localhost
      ansible.builtin.find:
        paths: /tmp/fleet_facts
        file_type: file
      register: existing_fact_files
      become: no

    - name: Prune only stale fact files for hosts no longer in inventory (ghosts)
      run_once: true
      delegate_to: localhost
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ existing_fact_files.files }}"
      loop_control:
        label: "{{ item.path | basename }}"
      when: (item.path | basename) not in ansible_play_hosts_all
      become: no

    # ── Gather standard Ansible facts ────────────────────────────────────────
    - name: Gather full hardware facts explicitly in raw format
      ansible.builtin.setup:
      register: raw_facts

# ── Count connected screens (cross-platform) ────────────────────────────
    - name: Count connected screens
      ansible.builtin.shell: |
        if [ "$(uname)" = "Darwin" ]; then
          system_profiler SPDisplaysDataType 2>/dev/null | grep -c "Resolution:" || echo 0
        else
          cat /sys/class/drm/*/status 2>/dev/null | grep -c "^connected" || echo 0
        fi
      register: screen_count
      changed_when: false
      when: raw_facts is not unreachable

    # ── Total and used storage in GB (cross-platform) ────────────────────────
    - name: Get total and used storage in GB
      ansible.builtin.shell: |
        if [ "$(uname)" = "Darwin" ]; then
          df -g / | awk 'NR==2 {print $2, $3}'
        else
          df -BG --total \
            --exclude-type=tmpfs \
            --exclude-type=devtmpfs \
            --exclude-type=squashfs \
            --exclude-type=overlay 2>/dev/null \
          | awk 'END{gsub("G","",$2); gsub("G","",$3); print $2, $3}'
        fi
      register: storage_info
      changed_when: false
      when: raw_facts is not unreachable

    # ── Merge custom metrics into the fact blob ───────────────────────────────
    - name: Merge custom metrics into facts
      ansible.builtin.set_fact:
        combined_facts: >-
          {{
            raw_facts |
            combine({
              'ansible_facts': raw_facts.ansible_facts | combine({
                'ansible_local': {
                  'custom_metrics': {
                    'screens_connected': screen_count.stdout | trim | int,
                    'total_storage':     (storage_info.stdout.split()[0] | int) | string + ' GB',
                    'used_storage':      (storage_info.stdout.split()[1] | int) | string + ' GB',
                    'free_storage':      ((storage_info.stdout.split()[0] | int) - (storage_info.stdout.split()[1] | int)) | string + ' GB'
                  }
                }
              })
            })
          }}
      when: raw_facts is not unreachable

    # ── Save per-host facts (including custom metrics) ────────────────────────
    - name: Save each server's facts (with custom metrics) into the directory
      delegate_to: localhost
      ansible.builtin.copy:
        content: "{{ combined_facts | to_json }}"
        dest: "/tmp/fleet_facts/{{ inventory_hostname }}"
      become: no
      when: raw_facts is not unreachable

    # ── Install ansible-cmdb inside Semaphore container ──────────────────────
    - name: Install ansible-cmdb and Python 3.12 patch inside the Semaphore container
      run_once: true
      delegate_to: localhost
      ansible.builtin.pip:
        name:
          - ansible-cmdb
          - zombie-imp
        extra_args: "--break-system-packages"
      become: no

    # ── Create custom column definitions for ansible-cmdb ─────────────────────
    # Uses the built-in --cust-cols feature instead of template patching.
    # The "jsonxs" key tells ansible-cmdb the dot-path into the host data.
    - name: Create custom column definitions file
      run_once: true
      delegate_to: localhost
      ansible.builtin.copy:
        content: |
          [
            {
              "title": "Screens",
              "id": "screens",
              "sType": "num",
              "visible": True,
              "jsonxs": "ansible_facts.ansible_local.custom_metrics.screens_connected"
            },
            {
              "title": "Total storage",
              "id": "total_storage",
              "sType": "string",
              "visible": True,
              "jsonxs": "ansible_facts.ansible_local.custom_metrics.total_storage"
            },
            {
              "title": "Used storage",
              "id": "used_storage",
              "sType": "string",
              "visible": True,
              "jsonxs": "ansible_facts.ansible_local.custom_metrics.used_storage"
            },
            {
              "title": "Free storage",
              "id": "free_storage",
              "sType": "string",
              "visible": True,
              "jsonxs": "ansible_facts.ansible_local.custom_metrics.free_storage"
            }
          ]
        dest: /tmp/fleet_cust_cols.json
      become: no

    # ── Generate the HTML dashboard ───────────────────────────────────────────
    - name: Generate the HTML Dashboard
      run_once: true
      delegate_to: localhost
      ansible.builtin.command: >
        ansible-cmdb
        --cust-cols /tmp/fleet_cust_cols.json
        -i {{ inventory_file }}
        /tmp/fleet_facts
      register: cmdb_html
      become: no

    # ── Write the finished dashboard to the shared Mac folder ────────────────
    - name: Save the finished Dashboard to the shared Mac folder
      run_once: true
      delegate_to: localhost
      ansible.builtin.copy:
        content: "{{ cmdb_html.stdout }}"
        dest: "/dashboard/index.html"
      become: no
