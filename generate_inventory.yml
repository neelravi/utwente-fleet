---
- name: Generate Fleet Hardware Dashboard
  hosts: all
  become: yes
  gather_facts: no
  tasks:

    - name: Create a temporary directory on Semaphore to store raw facts
      run_once: true
      delegate_to: localhost
      ansible.builtin.file:
        path: /tmp/fleet_facts
        state: directory
      become: no

    - name: Gather full hardware facts explicitly in raw format
      ansible.builtin.setup:
      register: raw_facts

    # ── NEW: Count connected screens via DRM (no X11/DISPLAY needed) ──────────
    - name: Count connected screens
      ansible.builtin.shell: |
        cat /sys/class/drm/*/status 2>/dev/null | grep -c "^connected" || echo 0
      register: screen_count
      changed_when: false

    # ── NEW: Total and used storage (excludes tmpfs, devtmpfs, squashfs) ───────
    - name: Get total and used storage in GB
      ansible.builtin.shell: |
        df -BG --total \
          --exclude-type=tmpfs \
          --exclude-type=devtmpfs \
          --exclude-type=squashfs \
          --exclude-type=overlay 2>/dev/null \
        | awk 'END{gsub("G","",$2); gsub("G","",$3); print $2, $3}'
      register: storage_info
      changed_when: false

    # ── NEW: Merge custom facts into the fact blob ────────────────────────────
    - name: Merge custom metrics into facts
      ansible.builtin.set_fact:
        combined_facts: >-
          {{
            raw_facts |
            combine({
              'ansible_facts': raw_facts.ansible_facts | combine({
                'ansible_local': {
                  'custom_metrics': {
                    'screens_connected': screen_count.stdout | trim | int,
                    'total_storage_gb':  storage_info.stdout.split()[0] | int,
                    'used_storage_gb':   storage_info.stdout.split()[1] | int
                  }
                }
              })
            })
          }}

    - name: Save each server's facts (with custom metrics) into the directory
      delegate_to: localhost
      ansible.builtin.copy:
        content: "{{ combined_facts | to_json }}"
        dest: "/tmp/fleet_facts/{{ inventory_hostname }}"
      become: no

    - name: Install ansible-cmdb and Python 3.12 patch inside the Semaphore container
      run_once: true
      delegate_to: localhost
      ansible.builtin.pip:
        name:
          - ansible-cmdb
          - zombie-imp
        extra_args: "--break-system-packages"
      become: no

    - name: Generate the HTML Dashboard
      run_once: true
      delegate_to: localhost
      ansible.builtin.command: ansible-cmdb -i {{ inventory_file }} /tmp/fleet_facts
      register: cmdb_html
      become: no

    - name: Save the finished Dashboard to the shared Mac folder
      run_once: true
      delegate_to: localhost
      ansible.builtin.copy:
        content: "{{ cmdb_html.stdout }}"
        dest: "/dashboard/index.html"
      become: no
