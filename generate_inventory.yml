---
- name: Generate Fleet Hardware Dashboard
  hosts: all
  become: yes
  gather_facts: no  # <-- Turn off automatic background gathering

  tasks:
    - name: Create a temporary directory on Semaphore to store raw facts
      run_once: true
      delegate_to: localhost
      ansible.builtin.file:
        path: /tmp/fleet_facts
        state: directory
      become: no

    - name: Gather full hardware facts explicitly in raw format
      ansible.builtin.setup:
      register: raw_facts   # <-- Capture the raw, unformatted data here

    - name: Save each server's raw facts into the directory
      delegate_to: localhost
      ansible.builtin.copy:
        content: "{{ raw_facts | to_json }}"
        dest: "/tmp/fleet_facts/{{ inventory_hostname }}"
      become: no

    - name: Install ansible-cmdb and Python 3.12 patch inside the Semaphore container
      run_once: true
      delegate_to: localhost
      ansible.builtin.pip:
        name: 
          - ansible-cmdb
          - zombie-imp
        extra_args: "--break-system-packages"
      become: no

    - name: Generate the HTML Dashboard
      run_once: true
      delegate_to: localhost
      ansible.builtin.command: ansible-cmdb -i {{ inventory_file }} /tmp/fleet_facts
      register: cmdb_html
      become: no

    - name: Save the finished Dashboard to the shared Mac folder
      run_once: true
      delegate_to: localhost
      ansible.builtin.copy:
        content: "{{ cmdb_html.stdout }}"
        dest: "/dashboard/index.html"
      become: no
