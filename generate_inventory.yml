---
- name: Generate Fleet Hardware Dashboard
  hosts: all
  become: yes
  gather_facts: yes

  tasks:
    - name: Create a temporary directory on Semaphore to store raw facts
      run_once: true
      delegate_to: localhost
      ansible.builtin.file:
        path: /tmp/fleet_facts
        state: directory
      become: no

    - name: Save each server's hardware facts into the directory
      delegate_to: localhost
      ansible.builtin.copy:
        # ansible-cmdb expects a specific JSON structure, which we build here
        content: "{{ {'ansible_facts': ansible_facts} | to_json }}"
        dest: "/tmp/fleet_facts/{{ inventory_hostname }}"
      become: no

    - name: Install ansible-cmdb inside the Semaphore container
      run_once: true
      delegate_to: localhost
      ansible.builtin.pip:
        name: ansible-cmdb
        extra_args: "--break-system-packages"
      become: no

    - name: Generate the HTML Dashboard
      run_once: true
      delegate_to: localhost
      ansible.builtin.command: ansible-cmdb /tmp/fleet_facts
      register: cmdb_html
      become: no

    - name: Push the finished Dashboard to ccpdesk002 for viewing
      run_once: true
      delegate_to: ccpdesk002
      ansible.builtin.copy:
        content: "{{ cmdb_html.stdout }}"
        dest: "/home/ravindra/fleet_dashboard.html"
        owner: ravindra
        mode: '0644'
